<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- seccion marks the current nav entry; "registro" hides navigation until the profile exists. -->
<header th:fragment="encabezado(seccion)" class="app-header">
    <div class="container app-header-inner">
        <a th:if="${seccion != 'registro'}" class="app-brand" th:href="@{/}">UniMarket</a>
        <span th:if="${seccion == 'registro'}" class="app-brand">UniMarket</span>
        <nav th:if="${seccion != 'registro'}" class="app-nav" aria-label="Principal">
            <ul>
                <li><a th:href="@{/categorias}"
                       th:attr="aria-current=${seccion == 'categorias'} ? 'page' : null">Categorías</a></li>
                <li><a th:href="@{/servicios/nuevo}"
                       th:attr="aria-current=${seccion == 'publicar'} ? 'page' : null">Publicar servicio</a></li>
                <li><a th:href="@{/perfil}"
                       th:attr="aria-current=${seccion == 'perfil'} ? 'page' : null">Mi perfil</a></li>
            </ul>
        </nav>
        <form th:action="@{/logout}" method="post" class="app-logout">
            <button type="submit" class="btn-text theme-secondary btn-sm">Cerrar sesión</button>
        </form>
    </div>
</header>
</body>
</html>
