<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicar servicio | UniMarket</title>
    <link th:replace="~{fragmentos/bootstrap :: styles}">
</head>
<body>
<header th:replace="~{fragmentos/encabezado :: encabezado('publicar')}"></header>
<main class="container app-main">
    <div class="page-form">
        <div class="page-head">
            <h1>Publicar un servicio</h1>
        </div>

        <form th:action="@{/servicios/nuevo}" th:object="${servicio}" method="post" novalidate class="app-form">
            <div th:if="${#fields.hasErrors('*')}" role="alert" id="resumen-errores" tabindex="-1"
                 class="alert theme-danger form-errors">
                <div>
                    <h2>Revisa los datos del servicio</h2>
                    <ul>
                        <li th:each="error : ${#fields.allErrors()}" th:text="${error}">Error</li>
                    </ul>
                </div>
            </div>

            <div class="form-card">
                <fieldset class="form-section">
                    <legend>Servicio</legend>
                    <div class="row g-5">
                        <div class="col-12 md:col-5 form-field">
                            <label for="categoriaId">Categoría</label>
                            <select th:field="*{categoriaId}" id="categoriaId" class="form-control" required
                                    th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid'"
                                    th:attr="aria-invalid=${#fields.hasErrors('categoriaId')},
                                             aria-errormessage=${#fields.hasErrors('categoriaId')} ? 'categoriaId-error' : null">
                                <option value="">Selecciona una categoría</option>
                                <option th:each="categoria : ${categorias}" th:value="${categoria.id}"
                                        th:text="${categoria.nombre}">Tutorías</option>
                            </select>
                            <strong th:if="${#fields.hasErrors('categoriaId')}" id="categoriaId-error" class="field-error"
                                    th:errors="*{categoriaId}">Error</strong>
                        </div>
                        <div class="col-12 md:col-7 form-field">
                            <label for="titulo">Título</label>
                            <input type="text" th:field="*{titulo}" id="titulo" class="form-control" maxlength="100" required
                                   placeholder="Por ejemplo: Tutorías de cálculo diferencial"
                                   th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'"
                                   th:attr="aria-invalid=${#fields.hasErrors('titulo')},
                                            aria-errormessage=${#fields.hasErrors('titulo')} ? 'titulo-error' : null">
                            <strong th:if="${#fields.hasErrors('titulo')}" id="titulo-error" class="field-error"
                                    th:errors="*{titulo}">Error</strong>
                        </div>
                        <div class="col-12 form-field">
                            <label for="descripcion">Descripción</label>
                            <textarea th:field="*{descripcion}" id="descripcion" class="form-control" rows="4" maxlength="5000" required
                                      th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"
                                      th:attr="aria-invalid=${#fields.hasErrors('descripcion')},
                                               aria-errormessage=${#fields.hasErrors('descripcion')} ? 'descripcion-error' : null"></textarea>
                            <strong th:if="${#fields.hasErrors('descripcion')}" id="descripcion-error" class="field-error"
                                    th:errors="*{descripcion}">Error</strong>
                        </div>
                        <div class="col-12 md:col-4 form-field">
                            <label for="tarifaPorHora">Tarifa por hora</label>
                            <div class="input-group">
                                <span class="input-group-text" aria-hidden="true">$</span>
                                <input type="number" th:field="*{tarifaPorHora}" id="tarifaPorHora" class="form-control" min="1" step="1"
                                       inputmode="numeric" required aria-describedby="tarifaPorHora-unidad"
                                       th:classappend="${#fields.hasErrors('tarifaPorHora')} ? 'is-invalid'"
                                       th:attr="aria-invalid=${#fields.hasErrors('tarifaPorHora')},
                                                aria-errormessage=${#fields.hasErrors('tarifaPorHora')} ? 'tarifaPorHora-error' : null">
                                <span class="input-group-text" id="tarifaPorHora-unidad">
                                    <abbr title="pesos colombianos">COP</abbr>
                                </span>
                            </div>
                            <strong th:if="${#fields.hasErrors('tarifaPorHora')}" id="tarifaPorHora-error" class="field-error"
                                    th:errors="*{tarifaPorHora}">Error</strong>
                        </div>
                        <div class="col-12 md:col-4 form-field">
                            <label for="intensidadHoraria">Horas por semana</label>
                            <input type="number" th:field="*{intensidadHoraria}" id="intensidadHoraria" class="form-control" min="1" max="168" step="1"
                                   inputmode="numeric" required
                                   th:classappend="${#fields.hasErrors('intensidadHoraria')} ? 'is-invalid'"
                                   th:attr="aria-invalid=${#fields.hasErrors('intensidadHoraria')},
                                            aria-errormessage=${#fields.hasErrors('intensidadHoraria')} ? 'intensidadHoraria-error' : null">
                            <strong th:if="${#fields.hasErrors('intensidadHoraria')}" id="intensidadHoraria-error" class="field-error"
                                    th:errors="*{intensidadHoraria}">Error</strong>
                        </div>
                        <div class="col-12 md:col-4 form-field">
                            <label for="especialidad">Especialidad <span class="optional">(opcional)</span></label>
                            <input type="text" th:field="*{especialidad}" id="especialidad" class="form-control" maxlength="100"
                                   th:classappend="${#fields.hasErrors('especialidad')} ? 'is-invalid'"
                                   th:attr="aria-invalid=${#fields.hasErrors('especialidad')}">
                            <strong th:if="${#fields.hasErrors('especialidad')}" class="field-error" th:errors="*{especialidad}">Error</strong>
                        </div>
                        <div class="col-12 form-field">
                            <label for="experiencia">Experiencia <span class="optional">(opcional)</span></label>
                            <textarea th:field="*{experiencia}" id="experiencia" class="form-control" rows="2" maxlength="5000"
                                      th:classappend="${#fields.hasErrors('experiencia')} ? 'is-invalid'"
                                      th:attr="aria-invalid=${#fields.hasErrors('experiencia')}"></textarea>
                            <strong th:if="${#fields.hasErrors('experiencia')}" class="field-error" th:errors="*{experiencia}">Error</strong>
                        </div>
                    </div>
                </fieldset>

                <fieldset th:replace="~{fragmentos/franjas :: franjas(ayuda=null)}"></fieldset>

                <div class="form-actions">
                    <button type="submit" class="btn-solid theme-primary">Publicar servicio</button>
                </div>
            </div>
        </form>
    </div>
</main>
<script th:replace="~{fragmentos/bootstrap :: scripts}"></script>
</body>
</html>
