previews:
  generation: "off"

services:
  - type: web
    name: unimarket-main
    runtime: image
    image:
      url: ghcr.io/nauj2024/unimarket:main
    plan: free
    region: virginia
    autoDeployTrigger: "off"
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
